<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#1a1140"/>
      <stop offset="1" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#7b61ff"/>
      <stop offset="1" stop-color="#6affa3"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#bg)"/>

  <g filter="url(#shadow)">
    <rect x="120" y="150" width="960" height="500" rx="42" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.10)"/>
    <rect x="160" y="190" width="880" height="420" rx="32" fill="rgba(5,7,15,0.35)" stroke="rgba(255,255,255,0.10)"/>
  </g>

  <g>
    <text x="600" y="375" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="900" fill="#e9eefc">
      โอ้กจู๋
    </text>
    <text x="600" y="435" text-anchor="middle" font-family="system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" fill="rgba(233,238,252,0.78)">
      Sales Tracker Dashboard
    </text>
    <rect x="420" y="470" width="360" height="8" rx="4" fill="url(#accent)"/>
  </g>
</svg>

